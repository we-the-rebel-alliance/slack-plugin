name: Release

# A tag v<package.json version> on a master commit whose CI passed creates the GitHub Release. Releases are not
# published to npm: a consumer pins the tag, github:we-the-rebel-alliance/slack-plugin#v<version>, and the committed
# dist/ is what that install runs. Only the owner decides a release; an agent never pushes a tag on its own.
#
# Least privilege: `build` runs repository code with `contents: read`; only `publish`, which runs no repository code
# and takes the artifact `build` produced, holds `contents: write`.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Fetch the contract over HTTPS
        # The contract is a public repository, and npm records its GitHub dependency over ssh. A runner has no key.
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      # `npm run check` lints the workflows with actionlint, which the runner does not ship.
      - name: actionlint
        run: |
          set -euo pipefail
          version=1.7.12
          base="https://github.com/rhysd/actionlint/releases/download/v${version}"
          curl -sSfLO "${base}/actionlint_${version}_linux_amd64.tar.gz"
          curl -sSfLO "${base}/actionlint_${version}_checksums.txt"
          grep " actionlint_${version}_linux_amd64.tar.gz$" "actionlint_${version}_checksums.txt" | sha256sum -c -
          tar xzf "actionlint_${version}_linux_amd64.tar.gz" actionlint
          echo "$PWD" >> "$GITHUB_PATH"
      - run: npm ci --ignore-scripts
      - name: The tag names this package's version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          test "v${version}" = "$TAG"
      - name: The committed bundle is current
        run: npm run bundle && git diff --exit-code dist/
      - run: npm run check
      - name: Pack the release files
        run: |
          set -euo pipefail
          mkdir -p release
          npx plugin-kit check --json > release/conformance.json
          npm pack --pack-destination release
          sha256sum release/*.tgz release/conformance.json > release/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release
          path: release/
          if-no-files-found: error

  publish:
    name: publish
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release
          path: release
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release create "$TAG" release/*.tgz release/conformance.json release/SHA256SUMS --repo "$REPO" --verify-tag --title "$TAG" --generate-notes
